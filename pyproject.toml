[project]
name = "aqara-studio-home-assistant"
version = "0.1.3b1"
description = "Independent local Aqara Studio integration for Home Assistant"
requires-python = ">=3.14.2"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers --strict-config --timeout=60"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.aqara_studio"]

[tool.coverage.run]
source = ["custom_components/aqara_studio"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
