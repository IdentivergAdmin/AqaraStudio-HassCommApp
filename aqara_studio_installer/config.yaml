name: "Aqara Studio Integration Installer (Beta)"
version: "0.1.2"
slug: "aqara_studio_installer"
description: "One-click native integration installer/upgrader with backups. Restart Home Assistant Core afterward."
url: "https://github.com/IdentivergAdmin/AqaraStudio-HassCommApp"
arch:
  - amd64
  - aarch64
homeassistant: "2026.10.0"
startup: once
boot: manual_only
stage: experimental
# Minimal Alpine has no S6; use Supervisor's Docker init.
init: true
map:
  - type: homeassistant_config
    read_only: false
# This app no longer needs confirmation toggles; old options are ignored.
options: {}
schema: false
