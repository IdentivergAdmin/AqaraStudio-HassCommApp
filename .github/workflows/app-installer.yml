name: Supervisor App Installer
on:
  push:
    paths:
      - "repository.yaml"
      - "aqara_studio_installer/**"
      - "custom_components/aqara_studio/**"
      - "app_tests/test_installer.py"
      - ".github/workflows/app-installer.yml"
  pull_request:
    paths:
      - "repository.yaml"
      - "aqara_studio_installer/**"
      - "custom_components/aqara_studio/**"
      - "app_tests/test_installer.py"
      - ".github/workflows/app-installer.yml"
permissions:
  contents: read
jobs:
  validate-app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check shell syntax
        run: bash -n aqara_studio_installer/run.sh
      - name: Verify installer package matches the native integration
        run: diff -qr custom_components/aqara_studio aqara_studio_installer/rootfs/opt/aqara_studio
      - name: Install validation dependencies
        run: python3 -m pip install --break-system-packages pytest pytest-timeout PyYAML
      - name: Run installer tests
        run: python3 -m pytest -q -c /dev/null app_tests/test_installer.py
      - name: Build installer Docker image
        run: docker build --pull -t aqara-studio-installer:ci ./aqara_studio_installer
      - name: Smoke test actual Alpine installer (first install and no-op)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aqara-config"
          docker run --rm --init \
            -v "$RUNNER_TEMP/aqara-config:/homeassistant" \
            aqara-studio-installer:ci | tee "$RUNNER_TEMP/aqara-first.log"
          grep -q "FIRST INSTALL" "$RUNNER_TEMP/aqara-first.log"
          grep -q "SUCCESS" "$RUNNER_TEMP/aqara-first.log"
          test -f "$RUNNER_TEMP/aqara-config/custom_components/aqara_studio/manifest.json"
          docker run --rm --init \
            -v "$RUNNER_TEMP/aqara-config:/homeassistant" \
            aqara-studio-installer:ci | tee "$RUNNER_TEMP/aqara-current.log"
          grep -q "ALREADY CURRENT" "$RUNNER_TEMP/aqara-current.log"
          test ! -e "$RUNNER_TEMP/aqara-config/aqara_studio_installer_backups"
