name: Publish HACS beta release

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/aqara_studio/manifest.json"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-hacs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'IdentivergAdmin/AqaraStudio-HassCommApp'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff formatting
        run: python -m ruff format --check .
      - name: Full Home Assistant tests and distribution contract
        run: python -m pytest -q --cov=custom_components.aqara_studio --cov-report=term-missing

  validate:
    if: github.repository == 'IdentivergAdmin/AqaraStudio-HassCommApp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify HACS native integration layout
        shell: bash
        run: |
          set -euo pipefail
          test -f hacs.json
          test -f custom_components/aqara_studio/manifest.json
          test ! -e repository.yaml
          test ! -e aqara_studio_installer
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
          comment: false
      - name: Home Assistant hassfest
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361

  publish:
    name: Publish versioned GitHub prerelease
    if: github.repository == 'IdentivergAdmin/AqaraStudio-HassCommApp' && github.ref == 'refs/heads/main'
    needs: [test, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Publish only tested manifest version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("release_contract.json"))["github_release_tag"])')"
          python3 - <<'PY'
          import json
          import pathlib
          import tomllib
          root = pathlib.Path(".")
          contract = json.loads((root / "release_contract.json").read_text())
          manifest = json.loads((root / "custom_components/aqara_studio/manifest.json").read_text())
          hacs = json.loads((root / "hacs.json").read_text())
          project = tomllib.loads((root / "pyproject.toml").read_text())
          assert manifest["version"] == project["project"]["version"] == contract["github_release_tag"]
          assert contract["distribution"] == "hacs-marketplace"
          assert hacs["homeassistant"] == contract["minimum_home_assistant"]
          assert not (root / "repository.yaml").exists()
          assert not (root / "aqara_studio_installer").exists()
          assert contract["github_release_tag"] in (root / "docs/RELEASE_NOTES.md").read_text()
          PY
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing overwrite."
            exit 0
          fi
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "Aqara Studio $VERSION (beta)" \
            --notes-file docs/RELEASE_NOTES.md \
            --prerelease \
            --latest=false
          gh release view "$VERSION" --json tagName,isPrerelease,url
